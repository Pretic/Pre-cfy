name: Apply reviewed PreNet reliability patch
on:
  push:
    branches: [repair/prenet-reliability-20260919]
    paths: [.github/prenet-reviewed.patch]
permissions:
  contents: write
jobs:
  apply-reviewed-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: repair/prenet-reliability-20260919
          fetch-depth: 0
      - name: Verify reviewed inputs, apply patch, and run isolated tests
        shell: bash
        run: |
          set -euo pipefail
          echo '6d16153a0f77318aa9592a589029d5df89be6fe6fafc9c48a6a0cf0588479a89  cfy.sh' | sha256sum -c -
          echo '7faa5caccf03028a8fb4eef6aa672eb64c861750e4814db8b00619c2af0a5218  .github/prenet-reviewed.patch' | sha256sum -c -
          git apply --check .github/prenet-reviewed.patch
          git apply .github/prenet-reviewed.patch
          bash -n cfy.sh
          for test_script in tests/*.sh; do
            echo "Running $test_script"
            timeout 120 bash "$test_script"
          done
          find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -S error
          echo '33a059c58439bbfaa164e8f47018ba3d1bb46a39bab2cd18566b35dda7544b68  cfy.sh' | sha256sum -c -
      - name: Commit only validated source changes and remove temporary patch machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/prenet-reviewed.patch .github/workflows/prenet-reviewed-patch.yml
          git add -- cfy.sh tests/test_update_atomic_validation.sh
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: validate and atomically replace cfy during bounded updates'
          git push origin HEAD:refs/heads/repair/prenet-reliability-20260919
