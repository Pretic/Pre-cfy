name: Validate reviewed cfy quality patch
on:
  push:
    branches: [repair/prenet-quality-20260919]
    paths: [.github/prenet-quality.py, .github/workflows/prenet-quality.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: repair/prenet-quality-20260919
      - name: Apply reviewed source changes and run all tests
        run: |
          set -euo pipefail
          python3 .github/prenet-quality.py
          find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          for test in tests/*.sh; do echo "Running $test"; timeout 120 bash "$test"; done
          find . -type f -name '*.sh' -print0 | xargs -0 shellcheck -s bash -S error
          sha256sum cfy.sh
      - name: Commit tested source only
        run: |
          set -euo pipefail
          git rm .github/prenet-quality.py .github/workflows/prenet-quality.yml
          git add cfy.sh
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: screen cfy edges by default and preserve failures and existing subscriptions'
          git push origin HEAD:refs/heads/repair/prenet-quality-20260919
